name: Update Streak Stats SVG

on:
  schedule:
    - cron: "30 */6 * * *"  # offset 30 min from stats job
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download streak SVG from demolab
        run: |
          curl -s -o profile-streak.svg \
            "https://streak-stats.demolab.com/?user=hasnainprogrammer&theme=github-dark-blue&hide_border=true&date_format=M%20j%5B%2C%20Y%5D"
          # Verify we got an SVG, not an error page
          head -c 100 profile-streak.svg | grep -q '<svg' || (echo "ERROR: streak SVG not valid" && exit 1)

      - name: Commit streak SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-streak.svg
          git commit -m "chore: update streak SVG [skip ci]" || exit 0
          git push
