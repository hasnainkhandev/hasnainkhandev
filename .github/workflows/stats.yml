name: Update GitHub Stats SVGs

on:
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours
  workflow_dispatch:          # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=hasnainprogrammer&show_icons=true&theme=github_dark&hide_border=true&count_private=true"
          path: profile-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=hasnainprogrammer&layout=compact&theme=github_dark&hide_border=true&count_private=true&langs_count=8"
          path: profile-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-stats.svg profile-languages.svg
          git commit -m "chore: update GitHub stats SVGs [skip ci]" || exit 0
          git push
